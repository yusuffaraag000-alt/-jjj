<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovera Cafe | لوفيرا</title>

    <link rel="stylesheet" href="style.css">

    <!-- نفس الخطوط بدون حذف -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ✅ نفس اللوجو + إضافة حركة فقط -->
    <img src="moon.svg" alt="Lovera Logo" class="side-logo animated-logo">

    <section id="hero">
        <div class="logo">LOVERA</div>
        <div class="slogan">قهوة صنعت بحب تحت ضوء القمر</div>
        <button class="main-btn" onclick="startProcess()">اعمل الأوردر</button>
    </section>

    <div id="transition-screen">
        <div id="word-display"></div>
    </div>

    <section id="selection-page">
        <h1 style="letter-spacing: 2px;">أين ستجلس اليوم؟</h1>
        <div class="grid">
            <div class="box" onclick="setPlace('Side A')">Side A</div>
            <div class="box" onclick="setPlace('Side B')">Side B</div>
            <div class="box" onclick="setPlace('ترابيزة')">ترابيزة</div>
        </div>
    </section>

    <section id="menu-page">
        <h2 class="menu-title">LOVERA MENU</h2>

        <div id="items-container"></div>

        <div style="height: 150px;"></div>

        <!-- ✅ إضافة الإجمالي بدون حذف القديم -->
        <div class="order-footer">
            <div class="total-bar">
                الإجمالي: <span id="total-price">0</span> EGP
            </div>
            <button class="send-btn" onclick="handleFinalOrder()">إرسال الطلب</button>
        </div>

        <!-- الكود القديم زي ما هو -->
        
    </section>

    <script src="script.js"></script>
</body>
</html>
